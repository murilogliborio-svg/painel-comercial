# Alternativa mais simples: SQLite, sem servidor de banco.
# Adequado para até algumas dezenas de usuários. Backup é copiar o volume.
#
#   docker compose -f docker-compose.sqlite.yml up -d
#
services:
  app:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: producao
      DATABASE_URL: sqlite:/app/data/app.db
      APP_URL: ${APP_URL:?defina APP_URL no .env}
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
      TRUST_PROXY: "1"
    volumes:
      - dados-app:/app/data
    networks: [interna]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO no .env}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-dados:/data
      - caddy-config:/config
    networks: [interna]

volumes:
  dados-app:
  caddy-dados:
  caddy-config:

networks:
  interna:
    driver: bridge
