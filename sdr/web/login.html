<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Di Terrá — SDR de I.A.</title>
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1c1a34">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Di Terrá">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="login-tela">
  <div class="marca-wordmark marca-wordmark-lg"><span class="di">DI</span><span class="terra">TERRÁ</span></div>
  <div class="login-cartao">
    <h1>SDR de I.A.</h1>
    <div class="sub">Acesso restrito ao time comercial.</div>

    <form id="form-login" autocomplete="on" novalidate>
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required autocomplete="username"
             autocapitalize="none" spellcheck="false" placeholder="voce@empresa.com.br">

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" required autocomplete="current-password">

      <button type="submit" class="btn btn-largo" id="entrar">Entrar</button>
      <div class="erro-caixa escondido" id="erro" role="alert" aria-live="assertive"></div>
    </form>

    <p class="lede rodape-login">
      Esqueceu a senha? Procure o administrador — só ele pode redefinir.
    </p>
  </div>
</div>
<script type="module" src="/assets/login.js"></script>
</body>
</html>
